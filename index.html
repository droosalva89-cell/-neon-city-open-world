<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NEON CITY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;font-family:Arial;color:white}
canvas{display:block;width:100vw;height:100vh;background:#111}
#hud{
 position:fixed;top:15px;left:15px;right:15px;
 display:flex;justify-content:space-between;
 pointer-events:none;font-weight:bold;font-size:16px;
 text-shadow:0 0 8px #00eaff
}
#controls{position:fixed;inset:0;pointer-events:none}
.btn{
 position:absolute;width:64px;height:64px;border:2px solid #00eaff;
 background:#07141dcc;border-radius:16px;color:#fff;
 font-size:28px;pointer-events:auto;
 box-shadow:0 0 12px #00eaff55
}
#up{left:78px;bottom:125px}
#down{left:78px;bottom:35px}
#left{left:10px;bottom:80px}
#right{left:146px;bottom:80px}
#action{right:25px;bottom:80px;width:82px;height:82px;border-radius:50%;font-size:18px}
#hint{
 position:fixed;bottom:8px;left:0;right:0;
 text-align:center;color:#aaa;font-size:13px
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <span>💰 $<b id="money">500</b></span>
 <span>⭐ <b id="wanted">0</b></span>
 <span>🚗 NEON CITY</span>
</div>

<div id="controls">
 <button class="btn" id="up">▲</button>
 <button class="btn" id="down">▼</button>
 <button class="btn" id="left">◀</button>
 <button class="btn" id="right">▶</button>
 <button class="btn" id="action">ACTION</button>
</div>

<div id="hint">Drive around Neon City • ACTION to interact</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const keys={};
let money=500,wanted=0;

const player={
 x:0,y:0,angle:0,speed:0
};

const cars=[];
const npcs=[];

for(let i=0;i<18;i++){
 cars.push({
  x:(Math.random()-.5)*2200,
  y:(Math.random()-.5)*1600,
  a:Math.random()*Math.PI*2,
  color:["#ff1744","#00eaff","#ffd600","#9c27b0"][i%4]
 });
}

for(let i=0;i<25;i++){
 npcs.push({
  x:(Math.random()-.5)*1800,
  y:(Math.random()-.5)*1400,
  a:Math.random()*Math.PI*2
 });
}

function road(x,y){
 const gx=Math.abs((x%400)-200);
 const gy=Math.abs((y%400)-200);
 return gx<55 || gy<55;
}

function drawWorld(){
 ctx.fillStyle="#11131a";
 ctx.fillRect(0,0,W,H);

 const scale=1;
 ctx.save();
 ctx.translate(W/2-player.x,H/2-player.y);

 // city blocks
 for(let x=-1600;x<=1600;x+=400){
  for(let y=-1200;y<=1200;y+=400){
   ctx.fillStyle="#181b24";
   ctx.fillRect(x+65,y+65,270,270);
  }
 }

 // roads
 ctx.strokeStyle="#292d38";
 ctx.lineWidth=110;
 for(let x=-2000;x<=2000;x+=400){
  ctx.beginPath();ctx.moveTo(x,-1500);ctx.lineTo(x,1500);ctx.stroke();
 }
 for(let y=-1600;y<=1600;y+=400){
  ctx.beginPath();ctx.moveTo(-2200,y);ctx.lineTo(2200,y);ctx.stroke();
 }

 // road lines
 ctx.strokeStyle="#777";
 ctx.lineWidth=3;
 ctx.setLineDash([25,25]);

 for(let x=-2000;x<=2000;x+=400){
  ctx.beginPath();ctx.moveTo(x,-1500);ctx.lineTo(x,1500);ctx.stroke();
 }
 for(let y=-1600;y<=1600;y+=400){
  ctx.beginPath();ctx.moveTo(-2200,y);ctx.lineTo(2200,y);ctx.stroke();
 }
 ctx.setLineDash([]);

 // buildings
 for(let x=-1600;x<=1600;x+=400){
  for(let y=-1200;y<=1200;y+=400){
   ctx.fillStyle="#242936";
   ctx.fillRect(x+85,y+85,230,230);

   ctx.fillStyle="#00eaff";
   for(let wx=x+105;wx<x+300;wx+=38)
    for(let wy=y+105;wy<y+290;wy+=42)
     ctx.fillRect(wx,wy,12,16);
  }
 }

 // NPCs
 for(const n of npcs){
  ctx.fillStyle="#ffb199";
  ctx.beginPath();
  ctx.arc(n.x,n.y,8,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#55aaff";
  ctx.fillRect(n.x-6,n.y+8,12,18);
 }

 // cars
 for(const c of cars){
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.rotate(c.a);
  ctx.fillStyle=c.color;
  ctx.shadowBlur=12;
  ctx.shadowColor=c.color;
  ctx.fillRect(-22,-12,44,24);
  ctx.fillStyle="#111";
  ctx.fillRect(-12,-9,20,8);
  ctx.restore();
 }

 // player car
 ctx.save();
 ctx.translate(player.x,player.y);
 ctx.rotate(player.angle);
 ctx.shadowBlur=20;
 ctx.shadowColor="#00eaff";
 ctx.fillStyle="#00eaff";
 ctx.fillRect(-28,-15,56,30);
 ctx.fillStyle="#111";
 ctx.fillRect(-12,-11,22,9);
 ctx.fillStyle="#fff";
 ctx.fillRect(22,-8,5,6);
 ctx.fillRect(22,2,5,6);
 ctx.restore();

 ctx.restore();
}

function update(){
 if(keys.up||keys.w) player.speed+=0.18;
 if(keys.down||keys.s) player.speed-=0.12;

 player.speed*=0.94;
 player.speed=Math.max(-3,Math.min(7,player.speed));

 if(keys.left||keys.a) player.angle-=0.045*(Math.abs(player.speed)/3+.3);
 if(keys.right||keys.d) player.angle+=0.045*(Math.abs(player.speed)/3+.3);

 player.x+=Math.cos(player.angle)*player.speed;
 player.y+=Math.sin(player.angle)*player.speed;

 drawWorld();
 requestAnimationFrame(update);
}

function action(){
 money+=50;
 wanted=Math.min(5,wanted+1);
 document.getElementById("money").textContent=money;
 document.getElementById("wanted").textContent=wanted;
}

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===" ")action();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function hold(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  b.addEventListener(ev,e=>keys[key]=false);
 });
}

hold("up","up");
hold("down","down");
hold("left","left");
hold("right","right");

document.getElementById("action").addEventListener("pointerdown",action);

update();
</script>
</body>
</html>
