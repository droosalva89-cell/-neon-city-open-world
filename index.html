<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>City Drive Open World</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  min-width:175px;
  padding:9px 12px;
  border-radius:9px;
  background:rgba(0,0,0,.62);
  color:#fff;
  font-size:14px;
  line-height:1.55;
  text-shadow:0 1px 3px #000;
  pointer-events:none;
}

#mission{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:8px 16px;
  border-radius:20px;
  background:rgba(0,0,0,.62);
  color:#fff;
  font-size:13px;
  text-align:center;
  pointer-events:none;
}

#minimap{
  position:fixed;
  top:12px;
  right:12px;
  width:150px;
  height:150px;
  z-index:20;
  border:2px solid rgba(255,255,255,.8);
  border-radius:10px;
  background:#222;
}

#controls{
  position:fixed;
  left:18px;
  bottom:18px;
  width:190px;
  height:145px;
  z-index:30;
}

.control{
  position:absolute;
  width:58px;
  height:58px;
  border:1px solid rgba(255,255,255,.65);
  border-radius:12px;
  background:rgba(25,25,25,.72);
  color:white;
  font-size:24px;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
  touch-action:none;
}

.control:active{
  background:rgba(255,255,255,.25);
}

#up{
  left:66px;
  top:0;
}

#left{
  left:0;
  top:65px;
}

#down{
  left:66px;
  top:65px;
}

#right{
  left:132px;
  top:65px;
}

#actions{
  position:fixed;
  right:20px;
  bottom:20px;
  width:210px;
  height:145px;
  z-index:30;
}

.action{
  position:absolute;
  border:1px solid rgba(255,255,255,.7);
  background:rgba(25,25,25,.75);
  color:#fff;
  border-radius:50%;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
  font-weight:bold;
  touch-action:none;
}

#gas{
  right:0;
  top:0;
  width:72px;
  height:72px;
}

#brake{
  right:5px;
  bottom:0;
  width:62px;
  height:62px;
}

#horn{
  left:0;
  bottom:8px;
  width:65px;
  height:65px;
}

#interact{
  left:45px;
  top:5px;
  width:58px;
  height:58px;
}

#rotateMessage{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  background:#202020;
  color:white;
  font-size:20px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:175px;
  transform:translateX(-50%);
  z-index:100;
  padding:9px 15px;
  border-radius:8px;
  background:rgba(0,0,0,.8);
  color:white;
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
}

#start{
  position:fixed;
  inset:0;
  z-index:150;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      rgba(0,0,0,.42),
      rgba(0,0,0,.7)
    ),
    #40566a;
}

#startBox{
  width:min(92%,430px);
  padding:30px;
  text-align:center;
  border-radius:16px;
  background:rgba(20,20,20,.9);
  color:white;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#startBox h1{
  font-size:34px;
  margin-bottom:10px;
}

#startBox p{
  color:#ddd;
  line-height:1.5;
}

#startButton{
  margin-top:18px;
  padding:13px 28px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

.hidden{
  display:none!important;
}

@media (orientation:portrait){
  #rotateMessage{
    display:flex;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>
<canvas id="minimap"></canvas>

<div id="hud">
  💵 $<span id="money">500</span><br>
  ❤️ <span id="health">100</span>%<br>
  ⭐ Wanted <span id="wanted">0</span><br>
  🚗 <span id="speed">0</span> km/h
</div>

<div id="mission">
  🎯 Drive to the marked location
</div>

<div id="toast"></div>

<div id="controls">
  <button class="control" id="up">▲</button>
  <button class="control" id="left">◀</button>
  <button class="control" id="down">▼</button>
  <button class="control" id="right">▶</button>
</div>

<div id="actions">
  <button class="action" id="gas">GAS</button>
  <button class="action" id="brake">BRAKE</button>
  <button class="action" id="horn">🔊</button>
  <button class="action" id="interact">E</button>
</div>

<div id="rotateMessage">
  📱<br><br>
  Rotate your phone to<br>
  <b>LANDSCAPE</b> mode
</div>

<div id="start">
  <div id="startBox">
    <h1>🏙️ CITY DRIVE</h1>
    <p>
      Explore the city, drive through traffic,
      collect money and complete missions.
    </p>

    <button id="startButton">
      START GAME
    </button>
  </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mctx=minimap.getContext("2d");

let W=0;
let H=0;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

/* =========================
   WORLD
========================= */

const WORLD_W=5000;
const WORLD_H=3800;
const BLOCK=320;
const ROAD=115;

const player={
  x:WORLD_W/2,
  y:WORLD_H/2,
  angle:0,
  speed:0,
  maxSpeed:7,
  health:100
};

const keys={
  up:false,
  down:false,
  left:false,
  right:false
};

let money=500;
let wanted=0;
let gameStarted=false;
let missionComplete=false;
let dayTime=0;

const buildings=[];
const trees=[];
const cars=[];
const pedestrians=[];
const coins=[];
const lights=[];

/* =========================
   HELPERS
========================= */

function rand(min,max){
  return Math.random()*(max-min)+min;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function distance(ax,ay,bx,by){
  return Math.hypot(ax-bx,ay-by);
}

function roadAt(x,y){
  const rx=((x%BLOCK)+BLOCK)%BLOCK;
  const ry=((y%BLOCK)+BLOCK)%BLOCK;

  return rx<ROAD || ry<ROAD;
}

/* =========================
   CITY GENERATION
========================= */

function generateCity(){

  buildings.length=0;
  trees.length=0;
  lights.length=0;

  for(let x=0;x<WORLD_W;x+=BLOCK){

    for(let y=0;y<WORLD_H;y+=BLOCK){

      const bx=x+ROAD+18;
      const by=y+ROAD+18;

      const bw=BLOCK-ROAD-36;
      const bh=BLOCK-ROAD-36;

      buildings.push({
        x:bx,
        y:by,
        w:bw,
        h:bh,
        floors:Math.floor(rand(1,7)),
        roof:Math.random()>.5
      });
    }
  }

  for(let i=0;i<180;i++){

    let x=rand(40,WORLD_W-40);
    let y=rand(40,WORLD_H-40);

    if(!roadAt(x,y)){

      trees.push({
        x,
        y,
        size:rand(8,16)
      });
    }
  }

  for(let i=0;i<90;i++){

    lights.push({
      x:rand(50,WORLD_W-50),
      y:rand(50,WORLD_H-50)
    });
  }
}

generateCity();

/* =========================
   TRAFFIC
========================= */

function generateTraffic(){

  cars.length=0;

  for(let i=0;i<32;i++){

    const horizontal=Math.random()>.5;

    const roadIndex=Math.floor(
      rand(0,
      horizontal
        ? WORLD_H/BLOCK
        : WORLD_W/BLOCK)
    );

    let x;
    let y;

    if(horizontal){

      y=roadIndex*BLOCK+ROAD/2;
      x=rand(0,WORLD_W);

    }else{

      x=roadIndex*BLOCK+ROAD/2;
      y=rand(0,WORLD_H);
    }

    cars.push({
      x,
      y,
      angle:horizontal?0:Math.PI/2,
      speed:rand(1,2.8),
      color:[
        "#ffffff",
        "#222222",
        "#b92727",
        "#284d8f",
        "#777777",
        "#d9d0a2"
      ][Math.floor(rand(0,6))]
    });
  }
}

generateTraffic();

/* =========================
   PEOPLE
========================= */

for(let i=0;i<70;i++){

  pedestrians.push({
    x:rand(50,WORLD_W-50),
    y:rand(50,WORLD_H-50),
    angle:rand(0,Math.PI*2),
    speed:rand(.15,.5),
    shirt:[
      "#333",
      "#555",
      "#884",
      "#446",
      "#663"
    ][Math.floor(rand(0,5))]
  });
}

/* =========================
   COINS
========================= */

for(let i=0;i<45;i++){

  coins.push({
    x:rand(100,WORLD_W-100),
    y:rand(100,WORLD_H-100),
    collected:false
  });
}

/* =========================
   MISSION
========================= */

const mission={
  x:WORLD_W*.76,
  y:WORLD_H*.28,
  reward:1000
};

/* =========================
   INPUT
========================= */

function holdButton(id,key){

  const button=document.getElementById(id);

  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  ["pointerup","pointercancel","pointerleave"].forEach(event=>{

    button.addEventListener(event,e=>{
      e.preventDefault();
      keys[key]=false;
    });
  });
}

holdButton("up","up");
holdButton("down","down");
holdButton("left","left");
holdButton("right","right");

const gas=document.getElementById("gas");
const brake=document.getElementById("brake");

gas.addEventListener("pointerdown",()=>{
  keys.up=true;
});

gas.addEventListener("pointerup",()=>{
  keys.up=false;
});

brake.addEventListener("pointerdown",()=>{
  keys.down=true;
});

brake.addEventListener("pointerup",()=>{
  keys.down=false;
});

window.addEventListener("keydown",e=>{

  const k=e.key.toLowerCase();

  if(k==="w"||e.key==="arrowup")keys.up=true;
  if(k==="s"||e.key==="arrowdown")keys.down=true;
  if(k==="a"||e.key==="arrowleft")keys.left=true;
  if(k==="d"||e.key==="arrowright")keys.right=true;
});

window.addEventListener("keyup",e=>{

  const k=e.key.toLowerCase();

  if(k==="w"||e.key==="arrowup")keys.up=false;
  if(k==="s"||e.key==="arrowdown")keys.down=false;
  if(k==="a"||e.key==="arrowleft")keys.left=false;
  if(k==="d"||e.key==="arrowright")keys.right=false;
});

document.getElementById("horn").addEventListener("click",()=>{
  showToast("🔊 HONK!");
});

document.getElementById("interact").addEventListener("click",()=>{
  interact();
});

/* =========================
   PLAYER
========================= */

function updatePlayer(){

  if(keys.up){
    player.speed+=.16;
  }

  if(keys.down){
    player.speed-=.13;
  }

  if(!keys.up&&!keys.down){

    if(player.speed>0)
      player.speed-=.07;

    if(player.speed<0)
      player.speed+=.07;
  }

  player.speed=clamp(
    player.speed,
    -2.8,
    player.maxSpeed
  );

  const steering=.035+
    Math.abs(player.speed)*.007;

  if(keys.left)
    player.angle-=steering;

  if(keys.right)
    player.angle+=steering;

  const oldX=player.x;
  const oldY=player.y;

  player.x+=Math.cos(player.angle)*player.speed;
  player.y+=Math.sin(player.angle)*player.speed;

  player.x=clamp(
    player.x,
    25,
    WORLD_W-25
  );

  player.y=clamp(
    player.y,
    25,
    WORLD_H-25
  );

  /* Building collision */

  for(const b of buildings){

    if(
      player.x>b.x-16 &&
      player.x<b.x+b.w+16 &&
      player.y>b.y-16 &&
      player.y<b.y+b.h+16
    ){

      player.x=oldX;
      player.y=oldY;
      player.speed*=-.25;
    }
  }
}

/* =========================
   TRAFFIC UPDATE
========================= */

function updateTraffic(){

  for(const car of cars){

    car.x+=Math.cos(car.angle)*car.speed;
    car.y+=Math.sin(car.angle)*car.speed;

    if(car.x>WORLD_W+20)
      car.x=-20;

    if(car.x<-20)
      car.x=WORLD_W+20;

    if(car.y>WORLD_H+20)
      car.y=-20;

    if(car.y<-20)
      car.y=WORLD_H+20;

    const d=distance(
      player.x,
      player.y,
      car.x,
      car.y
    );

    if(d<34){

      player.health-=.12;
      player.speed*=.8;

      if(player.health<=0){

        player.health=100;
        player.x=WORLD_W/2;
        player.y=WORLD_H/2;
        player.speed=0;

        money=Math.max(0,money-100);

        showToast("🚑 Vehicle repaired -$100");
      }
    }
  }
}

/* =========================
   PEOPLE UPDATE
========================= */

function updatePeople(){

  for(const p of pedestrians){

    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;

    if(Math.random()<.008){
      p.angle=rand(0,Math.PI*2);
    }

    p.x=clamp(p.x,20,WORLD_W-20);
    p.y=clamp(p.y,20,WORLD_H-20);
  }
}

/* =========================
   COINS
========================= */

function updateCoins(){

  for(const c of coins){

    if(c.collected)
      continue;

    if(
      distance(
        player.x,
        player.y,
        c.x,
        c.y
      )<25
    ){

      c.collected=true;

      money+=25;

      showToast("💵 +$25");
    }
  }
}

/* =========================
   MISSION
========================= */

function updateMission(){

  if(missionComplete)
    return;

  const d=distance(
    player.x,
    player.y,
    mission.x,
    mission.y
  );

  if(d<90){

    missionComplete=true;

    money+=mission.reward;

    document.getElementById("mission").textContent=
      "✅ Mission complete! Explore the city.";

    showToast(
      "MISSION COMPLETE +$"+mission.reward
    );
  }
}

/* =========================
   DRAW GROUND
========================= */

function drawGround(){

  ctx.fillStyle="#73806d";

  ctx.fillRect(
    0,
    0,
    WORLD_W,
    WORLD_H
  );

  /* Roads */

  for(let x=0;x<WORLD_W;x+=BLOCK){

    ctx.fillStyle="#424242";

    ctx.fillRect(
      x,
      0,
      ROAD,
      WORLD_H
    );

    ctx.strokeStyle="#c6b76b";
    ctx.lineWidth=2;
    ctx.setLineDash([25,22]);

    ctx.beginPath();

    ctx.moveTo(
      x+ROAD/2,
      0
    );

    ctx.lineTo(
      x+ROAD/2,
      WORLD_H
    );

    ctx.stroke();
  }

  for(let y=0;y<WORLD_H;y+=BLOCK){

    ctx.fillStyle="#424242";

    ctx.fillRect(
      0,
      y,
      WORLD_W,
      ROAD
    );

    ctx.strokeStyle="#c6b76b";

    ctx.beginPath();

    ctx.moveTo(
      0,
      y+ROAD/2
    );

    ctx.lineTo(
      WORLD_W,
      y+ROAD/2
    );

    ctx.stroke();
  }

  ctx.setLineDash([]);
}

/* =========================
   BUILDINGS
========================= */

function drawBuildings(){

  for(const b of buildings){

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.2)";

    ctx.fillRect(
      b.x+7,
      b.y+9,
      b.w,
      b.h
    );

    /* building */

    const shade=
      35+
      Math.floor(b.floors*8);

    ctx.fillStyle=
      "rgb("+shade+","+shade+","+shade+")";

    ctx.fillRect(
      b.x,
      b.y,
      b.w,
      b.h
    );

    /* roof */

    ctx.fillStyle="#292929";

    ctx.fillRect(
      b.x-3,
      b.y-4,
      b.w+6,
      7
    );

    /* windows */

    for(let wx=b.x+14;wx<b.x+b.w-10;wx+=24){

      for(
        let wy=b.y+15;
        wy<b.y+b.h-10;
        wy+=24
      ){

        const lit=Math.random()>.35;

        ctx.fillStyle=lit
          ? "#e9d27a"
          : "#242a2c";

        ctx.fillRect(
          wx,
          wy,
          9,
          12
        );
      }
    }
  }
}

/* =========================
   TREES
========================= */

function drawTrees(){

  for(const t of trees){

    ctx.fillStyle="#5b4028";

    ctx.fillRect(
      t.x-3,
      t.y,
      6,
      t.size
    );

    ctx.fillStyle="#315a32";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      t.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* =========================
   CARS
========================= */

function drawCar(
  x,
  y,
  angle,
  color,
  playerCar=false
){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(angle);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.3)";

  ctx.fillRect(
    -22,
    -11,
    44,
    22
  );

  /* body */

  ctx.fillStyle=color;

  ctx.fillRect(
    -22,
    -10,
    44,
    20
  );

  /* cabin */

  ctx.fillStyle="#20282d";

  ctx.fillRect(
    -9,
    -8,
    18,
    16
  );

  /* windshield */

  ctx.fillStyle="#78909c";

  ctx.fillRect(
    3,
    -7,
    7,
    14
  );

  /* lights */

  ctx.fillStyle="#fff3b0";

  ctx.fillRect(
    19,
    -7,
    4,
    5
  );

  ctx.fillRect(
    19,
    2,
    4,
    5
  );

  ctx.fillStyle="#ff3b30";

  ctx.fillRect(
    -23,
    -7,
    4,
    5
  );

  ctx.fillRect(
    -23,
    2,
    4,
    5
  );

  if(playerCar){

    ctx.strokeStyle="#fff";

    ctx.lineWidth=2;

    ctx.strokeRect(
      -24,
      -12,
      48,
      24
    );
  }

  ctx.restore();
}

/* =========================
   PEDESTRIANS
========================= */

function drawPeople(){

  for(const p of pedestrians){

    ctx.fillStyle="#d4a373";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y-6,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=p.shirt;

    ctx.fillRect(
      p.x-4,
      p.y-2,
      8,
      12
    );
  }
}

/* =========================
   COINS
========================= */

function drawCoins(){

  for(const c of coins){

    if(c.collected)
      continue;

    ctx.fillStyle="#d6b85a";

    ctx.beginPath();

    ctx.arc(
      c.x,
      c.y,
      6,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#fff0a0";
    ctx.stroke();
  }
}

/* =========================
   MISSION MARKER
========================= */

function drawMission(){

  if(missionComplete)
    return;

  const pulse=
    28+
    Math.sin(Date.now()*.004)*7;

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    mission.x,
    mission.y,
    pulse,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.fillStyle="#fff";

  ctx.font="bold 16px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "MISSION",
    mission.x,
    mission.y-40
  );
}

/* =========================
   WORLD DRAW
========================= */

function drawWorld(){

  ctx.save();

  ctx.translate(
    W/2-player.x,
    H/2-player.y
  );

  drawGround();
  drawBuildings();
  drawTrees();
  drawCoins();
  drawPeople();
  drawMission();

  for(const car of cars){

    drawCar(
      car.x,
      car.y,
      car.angle,
      car.color
    );
  }

  drawCar(
    player.x,
    player.y,
    player.angle,
    "#d9d9d9",
    true
  );

  ctx.restore();
}

/* =========================
   MINIMAP
========================= */

function drawMinimap(){

  const mw=145;
  const mh=145;

  minimap.width=mw;
  minimap.height=mh;

  mctx.fillStyle="#777";
  mctx.fillRect(0,0,mw,mh);

  const sx=mw/WORLD_W;
  const sy=mh/WORLD_H;

  /* roads */

  mctx.fillStyle="#444";

  for(let x=0;x<WORLD_W;x+=BLOCK){

    mctx.fillRect(
      x*sx,
      0,
      ROAD*sx,
      mh
    );
  }

  for(let y=0;y<WORLD_H;y+=BLOCK){

    mctx.fillRect(
      0,
      y*sy,
      mw,
      ROAD*sy
    );
  }

  /* mission */

  if(!missionComplete){

    mctx.fillStyle="#fff";

    mctx.beginPath();

    mctx.arc(
      mission.x*sx,
      mission.y*sy,
      4,
      0,
      Math.PI*2
    );

    mctx.fill();
  }

  /* traffic */

  mctx.fillStyle="#b22";

  for(const car of cars){

    mctx.fillRect(
      car.x*sx-1,
      car.y*sy-1,
      3,
      3
    );
  }

  /* player */

  mctx.fillStyle="#fff";

  mctx.beginPath();

  mctx.arc(
    player.x*sx,
    player.y*sy,
    4,
    0,
    Math.PI*2
  );

  mctx.fill();
}

/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById("money").textContent=
    money;

  document.getElementById("health").textContent=
    Math.round(player.health);

  document.getElementById("wanted").textContent=
    wanted;

  document.getElementById("speed").textContent=
    Math.round(Math.abs(player.speed)*20);
}

/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(text){

  const toast=document.getElementById("toast");

  toast.textContent=text;
  toast.style.opacity=1;

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.style.opacity=0;
  },1800);
}

/* =========================
   INTERACT
========================= */

function interact(){

  const d=distance(
    player.x,
    player.y,
    mission.x,
    mission.y
  );

  if(d<180){

    if(!missionComplete){

      missionComplete=true;

      money+=1000;

      document.getElementById("mission").textContent=
        "✅ Mission complete — free roam";

      showToast("MISSION COMPLETE +$1000");
    }

  }else{

    showToast(
      "Drive around the city and find the mission."
    );
  }
}

/* =========================
   DAY / NIGHT
========================= */

function drawLighting(){

  dayTime+=.0008;

  const darkness=
    .15+
    (Math.sin(dayTime)+1)*.18;

  ctx.fillStyle=
    "rgba(15,25,55,"+
    darkness+
    ")";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}

/* =========================
   GAME LOOP
========================= */

function update(){

  if(!gameStarted)
    return;

  updatePlayer();
  updateTraffic();
  updatePeople();
  updateCoins();
  updateMission();

  updateHUD();
}

function render(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  if(gameStarted){

    drawWorld();
    drawLighting();
    drawMinimap();
  }
}

function loop(){

  update();
  render();

  requestAnimationFrame(loop);
}

/* =========================
   START
========================= */

document.getElementById("startButton")
.addEventListener("click",()=>{

  gameStarted=true;

  document
    .getElementById("start")
    .classList.add("hidden");

  showToast(
    "Welcome to the city. Drive to the marker."
  );
});

loop();
</script>

</body>
</html>
