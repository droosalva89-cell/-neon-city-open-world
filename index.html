<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON CITY</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050510;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #070716;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  font-size: 18px;
  line-height: 1.7;
  text-shadow:
    0 0 5px #00ffff,
    0 0 12px #ff00ff;
  pointer-events: none;
}

#hint {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  text-align: center;
  font-size: 14px;
  color: #ddd;
  text-shadow: 0 0 8px #00ffff;
  pointer-events: none;
}

#controls {
  position: fixed;
  bottom: 25px;
  left: 25px;
  z-index: 10;
  display: grid;
  grid-template-columns: 60px 60px 60px;
  grid-template-rows: 60px 60px;
  gap: 6px;
}

.btn {
  border: 2px solid #00ffff;
  border-radius: 12px;
  background: rgba(0, 255, 255, 0.12);
  color: white;
  font-size: 25px;
  box-shadow:
    0 0 8px #00ffff,
    inset 0 0 8px rgba(0,255,255,.2);
  touch-action: none;
}

.btn:active {
  background: rgba(255, 0, 255, 0.35);
  border-color: #ff00ff;
}

#up {
  grid-column: 2;
}

#left {
  grid-column: 1;
  grid-row: 2;
}

#down {
  grid-column: 2;
  grid-row: 2;
}

#right {
  grid-column: 3;
  grid-row: 2;
}

#action {
  position: fixed;
  right: 25px;
  bottom: 30px;
  z-index: 10;
  width: 95px;
  height: 60px;
  border: 2px solid #ff00ff;
  border-radius: 14px;
  background: rgba(255, 0, 255, .15);
  color: white;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 0 12px #ff00ff;
  touch-action: none;
}

#message {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20;
  padding: 25px;
  text-align: center;
  border: 2px solid #00ffff;
  border-radius: 18px;
  background: rgba(5,5,20,.9);
  box-shadow: 0 0 25px #00ffff;
  display: none;
}

#message h1 {
  color: #00ffff;
  text-shadow: 0 0 12px #00ffff;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  💰 Coins: <span id="coins">0</span><br>
  ⭐ Score: <span id="score">0</span><br>
  🚗 NEON CITY
</div>

<div id="hint">
  Move around the city and collect the glowing coins!
</div>

<div id="controls">
  <button class="btn" id="up">▲</button>
  <button class="btn" id="left">◀</button>
  <button class="btn" id="down">▼</button>
  <button class="btn" id="right">▶</button>
</div>

<button id="action">COLLECT</button>

<div id="message">
  <h1>NEON CITY</h1>
  <p>Nice! You collected a coin.</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const coinText = document.getElementById("coins");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let W = 0;
let H = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const keys = {
  up: false,
  down: false,
  left: false,
  right: false
};

const player = {
  x: 0,
  y: 0,
  size: 18,
  speed: 4
};

let coins = 0;
let score = 0;

let cityOffsetX = 0;
let cityOffsetY = 0;

const coinList = [];

function randomCoin() {
  return {
    x: Math.random() * 1800 - 900,
    y: Math.random() * 1200 - 600,
    r: 8,
    collected: false,
    pulse: Math.random() * Math.PI * 2
  };
}

for (let i = 0; i < 35; i++) {
  coinList.push(randomCoin());
}

function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#05051a");
  gradient.addColorStop(1, "#12051c");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

function drawCity() {
  const grid = 80;

  ctx.save();

  ctx.translate(
    W / 2 - player.x,
    H / 2 - player.y
  );

  // Roads
  for (let x = -1000; x <= 1000; x += grid) {
    ctx.fillStyle = "#10101c";
    ctx.fillRect(x - 18, -800, 36, 1600);

    ctx.strokeStyle = "#00ffff";
    ctx.globalAlpha = 0.18;
    ctx.beginPath();
    ctx.moveTo(x, -800);
    ctx.lineTo(x, 800);
    ctx.stroke();
  }

  for (let y = -800; y <= 800; y += grid) {
    ctx.fillStyle = "#10101c";
    ctx.fillRect(-1200, y - 18, 2400, 36);

    ctx.strokeStyle = "#ff00ff";
    ctx.globalAlpha = 0.18;
    ctx.beginPath();
    ctx.moveTo(-1200, y);
    ctx.lineTo(1200, y);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;

  // Buildings
  for (let x = -1000; x <= 1000; x += grid) {
    for (let y = -800; y <= 800; y += grid) {

      const bx = x + 24;
      const by = y + 24;
      const bw = 48;
      const bh = 48;

      ctx.fillStyle = "#17172a";
      ctx.fillRect(bx, by, bw, bh);

      ctx.strokeStyle = Math.random() > 0.5
        ? "#00ffff"
        : "#ff00ff";

      ctx.globalAlpha = 0.45;
      ctx.strokeRect(bx, by, bw, bh);

      ctx.globalAlpha = 0.7;

      for (let wx = bx + 8; wx < bx + bw - 5; wx += 13) {
        for (let wy = by + 8; wy < by + bh - 5; wy += 13) {
          ctx.fillStyle =
            Math.random() > 0.5 ? "#00ffff" : "#ff00ff";

          ctx.fillRect(wx, wy, 5, 5);
        }
      }
    }
  }

  ctx.globalAlpha = 1;

  // Coins
  for (const coin of coinList) {
    if (coin.collected) continue;

    coin.pulse += 0.08;

    const scale = 1 + Math.sin(coin.pulse) * 0.2;

    ctx.beginPath();
    ctx.arc(
      coin.x,
      coin.y,
      coin.r * scale,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#ffd700";
    ctx.shadowColor = "#ffd700";
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fff";
    ctx.font = "10px Arial";
    ctx.textAlign = "center";
    ctx.fillText("$", coin.x, coin.y + 4);
  }

  ctx.restore();
}

function drawPlayer() {
  ctx.save();

  const x = W / 2;
  const y = H / 2;

  // Glow
  ctx.shadowColor = "#00ffff";
  ctx.shadowBlur = 25;

  ctx.fillStyle = "#00ffff";
  ctx.beginPath();
  ctx.arc(x, y, player.size, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // Body
  ctx.fillStyle = "#111122";
  ctx.beginPath();
  ctx.arc(x, y, 11, 0, Math.PI * 2);
  ctx.fill();

  // Direction marker
  ctx.fillStyle = "#ff00ff";
  ctx.beginPath();
  ctx.moveTo(x, y - 14);
  ctx.lineTo(x - 6, y - 3);
  ctx.lineTo(x + 6, y - 3);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function update() {
  if (keys.up) player.y -= player.speed;
  if (keys.down) player.y += player.speed;
  if (keys.left) player.x -= player.speed;
  if (keys.right) player.x += player.speed;

  // Coin collision
  for (const coin of coinList) {
    if (coin.collected) continue;

    const dx = player.x - coin.x;
    const dy = player.y - coin.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 28) {
      coin.collected = true;
      coins++;
      score += 50;

      coinText.textContent = coins;
      scoreText.textContent = score;

      showMessage();
    }
  }
}

function showMessage() {
  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 700);
}

function loop() {
  update();

  drawBackground();
  drawCity();
  drawPlayer();

  requestAnimationFrame(loop);
}

function control(direction, button) {
  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    keys[direction] = true;
  });

  button.addEventListener("pointerup", (e) => {
    e.preventDefault();
    keys[direction] = false;
  });

  button.addEventListener("pointercancel", () => {
    keys[direction] = false;
  });

  button.addEventListener("pointerleave", () => {
    keys[direction] = false;
  });
}

control("up", document.getElementById("up"));
control("down", document.getElementById("down"));
control("left", document.getElementById("left"));
control("right", document.getElementById("right"));

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp" || e.key === "w") keys.up = true;
  if (e.key === "ArrowDown" || e.key === "s") keys.down = true;
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
});

document.addEventListener("keyup", (e) => {
  if (e.key === "ArrowUp" || e.key === "w") keys.up = false;
  if (e.key === "ArrowDown" || e.key === "s") keys.down = false;
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
});

document.getElementById("action").addEventListener("click", () => {
  score += 10;
  scoreText.textContent = score;
  showMessage();
});

loop();
</script>

</body>
</html>
